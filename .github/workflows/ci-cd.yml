name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@v1
    with:
      docker-image-name: "testomniac_bot"
      skip-npm-publish: true
      notification-email: ${{ vars.NOTIFICATION_EMAIL }}
    secrets: inherit # Pass all repository secrets
